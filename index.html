<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 in 8 Billion: Finance Bro</title>
<meta name="description" content="Born somewhere random, weighted by real populations. Try to become a finance bro anyway. A browser life sim in English and Traditional Chinese.">
<meta property="og:type" content="website">
<meta property="og:title" content="1 in 8 Billion: Finance Bro">
<meta property="og:description" content="Born somewhere random. Try to make it anyway. A browser life sim about birth, luck and leverage.">
<meta property="og:url" content="https://angusmhlee113.github.io/1in8b-finance/">
<meta property="og:image" content="https://angusmhlee113.github.io/1in8b-finance/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="1 in 8 Billion: Finance Bro">
<meta name="twitter:description" content="Born somewhere random. Try to make it anyway.">
<meta name="twitter:image" content="https://angusmhlee113.github.io/1in8b-finance/og.jpg">
<style>
  :root {
    --bg: #f3f2ed;
    --card: #ffffff;
    --soft: #f7f6f2;
    --ink: #17181c;
    --muted: #6a6b74;
    --line: #e0ddd4;
    --accent: #0b7a4b;
    --accent-ink: #ffffff;
    --deep: #0f3d26;
    --deep-ink: #cfe8d9;
    --good: #0b7a4b;
    --bad: #c23a2b;
    --chip: #efece4;
    --track: #e7e4dc;
    --data-bg: #e8f2ec;
    --net: #1f7a8c;
    --hus: #b07d12;
    --san: #2f8f5b;
    --map-plain: #cfe0d5;
    --map-good: #6cbf8d;
    --map-great: #0b7a4b;
    --map-bad: #d9534f;
    --map-swan: #17181c;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --serif: Georgia, "Iowan Old Style", "Times New Roman", "Noto Serif TC", "PMingLiU", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111215; --card: #1b1c21; --soft: #202127; --ink: #ececf0; --muted: #9a9ba6; --line: #2c2d35;
      --accent: #33c486; --accent-ink: #06150e; --deep: #0d2a1c; --deep-ink: #9fd8b8; --good: #45d394; --bad: #ff6d5e;
      --chip: #25262d; --track: #2a2b32; --data-bg: #16261d; --net: #4fb3c7; --hus: #d9a63a; --san: #45d394;
      --map-plain: #2c3d33; --map-good: #3f8f5f; --map-great: #45d394; --map-bad: #d9534f; --map-swan: #000000; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111215; --card: #1b1c21; --soft: #202127; --ink: #ececf0; --muted: #9a9ba6; --line: #2c2d35;
    --accent: #33c486; --accent-ink: #06150e; --deep: #0d2a1c; --deep-ink: #9fd8b8; --good: #45d394; --bad: #ff6d5e;
    --chip: #25262d; --track: #2a2b32; --data-bg: #16261d; --net: #4fb3c7; --hus: #d9a63a; --san: #45d394;
    --map-plain: #2c3d33; --map-good: #3f8f5f; --map-great: #45d394; --map-bad: #d9534f; --map-swan: #000000; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .lang { display: inline-flex; padding: 3px; background: var(--chip); border-radius: 99px; }
  .lang button { border: 0; background: transparent; padding: 5px 12px; border-radius: 99px; font-size: .8rem; font-weight: 650; color: var(--muted); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .primary {
    display: block; width: 100%; margin-top: 18px; padding: 15px 20px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; text-align: center;
    transition: transform .1s, filter .15s;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(.99); }
  .secondary {
    display: block; width: 100%; margin-top: 10px; padding: 13px 20px; text-align: center;
    background: transparent; border: 1.5px solid var(--line); border-radius: 10px; font-weight: 600; cursor: pointer;
  }
  .secondary:hover { border-color: var(--accent); }
  a.save { text-decoration: none; color: inherit; }

  /* ---------- start screen ---------- */
  #app.start { max-width: 620px; margin: 0 auto; padding: 0 16px 56px; }
  .start-top { display: flex; justify-content: flex-end; padding: 14px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); animation: rise .28s ease-out; }
  .eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 700 clamp(2.2rem, 8vw, 3.4rem)/1.08 var(--serif); letter-spacing: -0.02em; margin: 8px 0 14px; }
  h1 em { font-style: normal; color: var(--accent); }
  .ticker { overflow: hidden; white-space: nowrap; border-block: 1px solid var(--line); margin: 0 -24px 20px; padding: 8px 0; font: 600 .8rem/1 var(--mono); }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 28s linear infinite; }
  .up { color: var(--good); } .down { color: var(--bad); }
  @keyframes tick { to { transform: translateX(-100%); } }
  .name-field { display: block; margin-top: 18px; }
  .name-field span { display: block; font-size: .85rem; font-weight: 650; margin-bottom: 6px; }
  .name-field input { width: 100%; padding: 13px 14px; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; }
  .name-field input:focus { outline: none; border-color: var(--accent); }
  .rolling { font-size: 4.5rem; text-align: center; padding: 40px 0 8px; }
  .rolling-name { text-align: center; font-weight: 700; color: var(--muted); min-height: 1.5em; }

  /* ---------- game: top bar ---------- */
  #app.game { max-width: 1440px; margin: 0 auto; padding: 0 20px 48px; }
  .gbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 12px 0; margin-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .brand { font: 700 1.35rem/1.1 var(--serif); white-space: nowrap; }
  .brand b { color: var(--accent); }
  .brand small { display: block; font: 700 .68rem/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .agebox { display: flex; align-items: center; gap: 8px; }
  .agelbl { font: 1.25rem var(--serif); }
  .agenum { font: 700 2.6rem/1 var(--serif); min-width: 1.3em; }
  .agesub { font-size: .82rem; color: var(--muted); max-width: 220px; }
  .agesub span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agesub .track { height: 4px; margin-top: 5px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
  .controls > button { padding: 7px 11px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .controls > button:hover:not(:disabled) { border-color: var(--accent); }
  .controls > button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .controls > button:disabled { opacity: .45; cursor: default; }

  /* ---------- game: panels ---------- */
  .cols { display: grid; grid-template-columns: minmax(270px, 340px) minmax(0, 1fr) minmax(270px, 340px); gap: 18px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; box-shadow: var(--shadow); }
  .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .phead h3 { font: 700 1.2rem/1.25 var(--serif); margin: 0; }
  .phead small { font: 700 .68rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }
  .phead .boom { color: var(--accent); }
  .track { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

  .idcard { padding: 0; overflow: hidden; }
  .id-head { display: flex; justify-content: space-between; background: var(--deep); color: var(--deep-ink); font: .8rem var(--mono); letter-spacing: .06em; padding: 10px 18px; }
  .id-body { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; padding: 16px 18px; }
  #avatar { width: 76px; height: 76px; image-rendering: pixelated; border-radius: 4px; border: 1px solid var(--line); }
  .id-name { font: 700 1.5rem/1.15 var(--serif); margin: 0 0 8px; overflow-wrap: anywhere; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: .86rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .dots { letter-spacing: 1px; }
  .mrz { font: .72rem/1.7 var(--mono); color: var(--muted); letter-spacing: .08em; border-top: 1px dashed var(--line); padding: 10px 18px; white-space: nowrap; overflow: hidden; }

  .stat { display: grid; grid-template-columns: 70px minmax(0, 1fr) 28px; gap: 10px; align-items: center; margin: 9px 0; }
  .stat .track { height: 10px; border-radius: 2px; }
  .stat .fill { border-radius: 2px; }
  .stat .fill.network { background: var(--net); } .stat .fill.hustle { background: var(--hus); } .stat .fill.sanity { background: var(--san); }
  .stat .fill.low { background: var(--bad); }
  .stat b { text-align: right; font-variant-numeric: tabular-nums; }
  details { margin: 10px 0 0; font-size: .86rem; color: var(--muted); }
  details summary { cursor: pointer; }
  details p { margin: 6px 0 0; }
  .money { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .money span { display: block; font-size: .78rem; color: var(--muted); }
  .money b { font: 700 1.1rem var(--mono); color: var(--good); }
  .money b.neg { color: var(--bad); }

  .scene { padding: 0; overflow: hidden; }
  #scene { display: block; width: 100%; aspect-ratio: 3 / 1; image-rendering: pixelated; }
  .caption { padding: 11px 18px; font-size: .92rem; border-top: 1px solid var(--line); }
  #focus .muted { font-size: .92rem; margin-bottom: 6px; }
  #focus p { color: var(--muted); margin: 0; }

  .log { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .log li.new { animation: rise .3s ease-out; }
  .log li:first-child { border-top: 0; }
  .rage { font: .8rem/1.9 var(--mono); color: var(--muted); }
  .rtitle { font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
  .log li.bad .rtext { color: var(--bad); }
  .log li.swan .rtext { font-weight: 650; }
  .log li.swan .rage::after { content: " ⚫"; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: .76rem; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--chip); }
  .chip.good { color: var(--good); } .chip.bad { color: var(--bad); }

  .frow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
  .frow:last-child { border-bottom: 0; }
  .frow > span:first-child { color: var(--muted); }
  .frow > span:last-child { text-align: right; }
  .frow small { display: block; color: var(--muted); font-size: .8rem; }
  .peer { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .peer:last-child { border-bottom: 0; }
  .peer b { display: block; }
  .peer small { color: var(--muted); font-size: .8rem; }
  .peer > span { color: var(--muted); font-size: .85rem; text-align: right; }
  .peer.gone { opacity: .55; }

  .lifemap { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .lifemap i, .legend i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--track); }
  .lifemap .plain, .legend .plain { background: var(--map-plain); }
  .lifemap .good, .legend .good { background: var(--map-good); }
  .lifemap .great, .legend .great { background: var(--map-great); }
  .lifemap .bad, .legend .bad { background: var(--map-bad); }
  .lifemap .swan, .legend .swan { background: var(--map-swan); }
  .lifemap .future { opacity: .55; }
  .lifemap .now { outline: 2px solid var(--ink); outline-offset: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .76rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; }

  /* ---------- popups ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(12,14,16,.5); display: flex; justify-content: center; align-items: flex-start; padding: 7vh 16px 24px; overflow-y: auto; }
  .modal { width: 100%; max-width: 780px; background: var(--card); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  .modal.enter { animation: rise .25s ease-out; }
  .modal.swan { border: 2px solid var(--ink); }
  .mhead { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .mlabel { font: .85rem var(--mono); color: var(--accent); letter-spacing: .04em; }
  .modal.swan .mlabel { color: var(--ink); }
  .mwhen { margin-left: auto; font: .85rem var(--mono); color: var(--muted); }
  .aside-btn { padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--chip); font-size: .8rem; cursor: pointer; }
  .mlabel, .mwhen, .aside-btn { white-space: nowrap; }
  .mbody { padding: 22px 26px 26px; }
  .modal h2 { font: 700 clamp(1.5rem, 4vw, 2rem)/1.2 var(--serif); margin: 0 0 10px; }
  .modal p { color: var(--muted); }
  .modal .outcome { color: var(--ink); font-size: 1.08rem; }
  .data { font: .8rem/1.65 var(--mono); background: var(--data-bg); border-left: 3px solid var(--accent); padding: 12px 14px; margin: 14px 0 4px; color: var(--ink); }
  .data b { color: var(--accent); margin-right: 4px; }
  .options { margin-top: 14px; }
  .option { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; width: 100%; text-align: left; margin-top: 10px; padding: 14px 16px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; transition: border-color .15s, transform .1s; }
  .option:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  .option:disabled { opacity: .5; cursor: not-allowed; }
  .onum { font: .85rem var(--mono); color: var(--muted); }
  .cl { display: block; font-weight: 650; }
  .cs { display: block; margin-top: 2px; font-size: .84rem; color: var(--muted); }
  .ghost { display: block; margin: 18px auto 0; padding: 9px 16px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: .88rem; cursor: pointer; }
  .ghost:hover { border-color: var(--accent); }
  .picked { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
  .picked b { color: var(--ink); }
  .pill { position: fixed; right: 20px; bottom: 20px; z-index: 50; padding: 12px 18px; border: 0; border-radius: 99px; background: var(--ink); color: var(--bg); font-weight: 650; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .bigflag { font-size: 3.6rem; line-height: 1; margin: 0 0 10px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
  .fact { background: var(--chip); border-radius: 10px; padding: 10px 12px; }
  .fact dt { font-size: .72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .fact dd { margin: 2px 0 0; font-weight: 650; }
  .flavor { font-style: italic; }
  .hint { font-size: .85rem; }
  .shot { display: block; width: 100%; max-width: 280px; margin: 6px auto 16px; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .end-emoji { font-size: 3.6rem; line-height: 1; margin-bottom: 8px; }
  .end-title { font-size: clamp(1.8rem, 6vw, 2.4rem) !important; }
  .end-nw { font: 800 clamp(2rem, 8vw, 2.8rem)/1.1 var(--mono); color: var(--good); margin: 6px 0 4px; }
  .end-nw.neg { color: var(--bad); }
  .rank { background: var(--chip); border-radius: 12px; padding: 14px 16px; margin: 16px 0 4px; }
  .rank strong { font-size: 1.1rem; }
  .rank .muted { margin-top: 4px; }
  .footnote { margin: 18px 0 0; font-size: .75rem; }
  .compare { background: var(--data-bg); }
  .end-h { font: 700 1.1rem var(--serif); margin: 22px 0 6px; }
  .epilogue { margin-bottom: 8px; }
  .endshot { max-width: 300px; border-radius: 10px; }

  @media (max-width: 1120px) {
    .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
    .cols > .col:last-child { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  }
  @media (max-width: 760px) {
    #app.game { padding: 0 12px 40px; }
    .gbar { gap: 10px 16px; }
    .brand { display: none; }
    .controls { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    .cols { grid-template-columns: minmax(0, 1fr); }
    .cols > .col:last-child { grid-template-columns: minmax(0, 1fr); }
    .backdrop { padding: 0; align-items: flex-end; }
    .modal { border-radius: 16px 16px 0 0; max-height: 92vh; overflow-y: auto; }
    .mbody { padding: 18px 18px 24px; }
    .mhead { padding: 12px 16px; gap: 8px; }
    .mlabel, .mwhen { font-size: .76rem; }
    .card { padding: 20px 18px; }
    .ticker { margin: 0 -18px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .modal.enter, .log li.new { animation: none; }
    .ticker span { animation: none; padding-left: 0; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/life.js"></script>
<script src="js/events.js"></script>
<script src="js/shocks.js"></script>
<script src="js/people.js"></script>
<script src="js/pixels.js"></script>
<script src="js/game.js"></script>
</body>
